spring.application.name=reserveroom

# --- Base de données (MariaDB sur la VM) ---
spring.datasource.url=jdbc:mariadb://${RESERVEROOM_DB_HOST}:3306/${RESERVEROOM_DB_NAME}
spring.datasource.username=${RESERVEROOM_DB_USER}
spring.datasource.password=${RESERVEROOM_DB_PASSWORD}

# --- JPA : Flyway crée le schéma, Hibernate le vérifie ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true